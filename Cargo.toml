[package]
name = "grelsolar"
version = "0.0.0" # Updated in CI
edition = "2024"
license = "MIT"
authors = ["Loïc Gremaud <loic.gremaud@grelinfo.ch>"]
description = "Sync solar data from Solar-Log to Home Assistant."
homepage = "https://github.com/grelinfo/grelsolar"
repository = "https://github.com/grelinfo/grelsolar"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
async-lock = "3.4.2"
chrono = "0.4.45"
dotenvy = "0.15.7"
env_logger = "0.11.11"
envconfig = "0.11.1"
failsafe = "1.3.0"
humantime = "2.4.0"
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["cookies", "form", "query", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-retry = "0.3.2"
tokio-util = "0.7.19"

[dev-dependencies]
http = "1.5.0"
httpmock = "0.8.3"
rstest = "0.27.0"
temp-env = { version = "0.3.6", features = ["async_closure"] }
tokio = { version = "1.53.1", features = ["test-util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[package.metadata.typos]
default.extend-ignore-re = [
    "SUCESS - You are now logged out.",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
